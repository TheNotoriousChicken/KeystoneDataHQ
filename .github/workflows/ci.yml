name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run founder guard tests (lightweight)
        run: node tests/runFoundersTests.mjs || true
      - name: Run lightweight test script (no heavy tests configured)
        run: npm run test-founders || true
      - name: Build frontend
        run: npm run build || true
